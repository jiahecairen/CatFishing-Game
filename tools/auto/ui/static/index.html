<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fishing · 工单审批台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color-scheme:dark;color:#e8ecf5;background:#11141b;--panel:#1b202a;--line:#303746;--muted:#9aa5b9;--blue:#60a5fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.4}
header{border-bottom:1px solid var(--line);background:#151923;padding:24px max(calc((100vw - 1200px)/2),24px)}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:24px;font-weight:750;letter-spacing:-.5px}.sub{font-size:13px;color:var(--muted);margin-top:7px}.signal{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:30px;padding:8px 14px;font-size:13px}.dot{width:8px;height:8px;background:#46c98d;border-radius:50%}
main{max-width:1200px;margin:0 auto;padding:28px 24px 60px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:25px}.tile{padding:20px;border:1px solid var(--line);background:var(--panel);border-radius:14px}.tile .value{font-size:27px;font-weight:750;font-variant-numeric:tabular-nums}.tile .label{color:var(--muted);font-size:13px;margin-top:8px}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:17px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.panelbar{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panelbar h2{font-size:16px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.list{max-height:740px;overflow:auto}.ticket{padding:17px 18px;border:0;border-bottom:1px solid #2b313c;width:100%;background:transparent;text-align:left;color:inherit;display:block}.ticket:hover{background:#242b39}.ticket.selected{background:#253047;border-left:3px solid #70adfb;padding-left:15px}.ticket-title{font-size:15px;font-weight:680;margin:0 0 8px}.ticket-sub{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{display:inline-block;padding:4px 9px;border-radius:8px;background:#333945;color:#cdd5e4;font-size:12px;white-space:nowrap}.tag.awaiting_approval{background:#53412b;color:#fbbf72}.tag.exec_ready,.tag.ready{background:#203f39;color:#74d8b3}.tag.in_review{background:#243e5b;color:#98c8ff}.tag.blocked{background:#4e2832;color:#ffaab6}.details{padding:22px;min-height:450px}.detail-title{font-size:23px;font-weight:730;letter-spacing:-.5px}.desc{color:var(--muted);font-size:13px;margin-top:7px}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.chips code{font-size:12px;border-radius:7px;background:#282f3b;padding:7px 10px}.section{margin-top:24px}.section h3{font-size:15px;margin:0 0 10px}.codebox{padding:15px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;background:#10151e;border:1px solid #333e50;border-radius:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.65}.buttons{display:flex;gap:10px;flex-wrap:wrap}.button{border-radius:9px;border:1px solid #465064;background:#303847;color:#e9eef7;padding:10px 14px;font-weight:600;font-size:13px}.button:hover:not(:disabled){background:#3b475b}.button.primary{background:#2b72e7;border-color:#2b72e7;color:white}.button.primary:hover{background:#3984ff}.button.secondary{background:transparent}.controls{margin-top:18px;padding:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:14px}.controls strong{margin-right:10px}.notice{margin:17px 0;padding:12px 15px;border:1px solid #4b5d74;color:#c4d6f0;background:#1a2b3c;border-radius:10px;font-size:13px;line-height:1.6}.notice.error{background:#45282e;border-color:#82424c;color:#ffd2d2}.notice.success{background:#1c443a;border-color:#326e58;color:#b5efd2}dialog{max-width:540px;width:calc(100% - 32px);background:#1d2430;color:#ecf1fa;border:1px solid #526078;border-radius:15px;padding:23px;box-shadow:0 30px 90px #0009}dialog::backdrop{background:#02040ae5}dialog h2{margin-top:0}label{font-size:13px;font-weight:650;display:block;margin:14px 0 6px}input,textarea{background:#10161f;border:1px solid #465165;color:#fff;border-radius:8px;padding:11px;width:100%;font-size:13px}textarea{min-height:75px;resize:vertical}input:focus,textarea:focus{outline:2px solid #6aa9ff;outline-offset:1px}.footer{margin-top:22px;color:#8e9cb1;font-size:12px;text-align:center}.warning{color:#f3bf77}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #506178;border-top-color:#87b7ff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:850px){.summary{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.list{max-height:310px}header{padding:20px}.top{align-items:flex-start}.signal{white-space:nowrap}}
</style>
</head>
<body>
<header><div class="top"><div><div class="brand">🎣 Fishing <span style="font-size:15px;font-weight:500;color:var(--muted)">/ AUTO-002</span></div><div class="sub" id="project">本地工单审批控制台</div></div><div class="signal"><i class="dot" id="dot"></i><span id="service-label">本地服务检查中</span></div></div></header>
<main>
<div class="summary"><div class="tile"><div class="value" id="count-total">—</div><div class="label">全部工单</div></div><div class="tile"><div class="value" id="count-pending">—</div><div class="label">待人工审批</div></div><div class="tile"><div class="value" id="count-ready">—</div><div class="label">可执行</div></div><div class="tile"><div class="value" id="count-review">—</div><div class="label">等待验收</div></div></div>
<div class="layout">
<section class="panel"><div class="panelbar"><h2>开发工单</h2><button class="button secondary" id="refresh">↻ 刷新</button></div><div class="list" id="tickets"><div style="padding:22px" class="muted">正在读取队列…</div></div></section>
<section class="panel"><div class="panelbar"><h2>工单详情与人工审批</h2><span class="small muted">审批不会自动运行编码</span></div><div class="details" id="details"><p class="muted">从左侧选择一张工单。</p></div></section>
</div>
<div class="controls"><strong>Runner 控制</strong><button class="button primary" id="run">▶ 启动已批准工单</button><button class="button" id="pause">Ⅱ 暂停下张工单</button><button class="button" id="resume">↻ 恢复</button><button class="button secondary" id="runner-status">查看 Runner 状态</button><button class="button secondary" id="logs">查看运行日志</button><span class="small muted" id="running"></span></div>
<div id="notification" class="notice" hidden></div>
<div class="footer">只在本机 127.0.0.1 提供服务 · 使用人工点击授权 · 不调用云模型 · 保留 AUTO-001 审查门禁</div>
</main>
<dialog id="approval"><h2>人工批准 Phase B</h2><p class="small muted">点击批准会写入现有审批账本，并把该工单设为 exec_ready；不会立即开始编码。</p><div id="approval-scope" class="codebox"></div><label>审批人（填写你的姓名或昵称）</label><input id="who" placeholder="例如 rain" maxlength="60" autocomplete="off"><label>测试命令（必须是 Godot / Python 单条测试命令）</label><input id="test-command" spellcheck="false" autocomplete="off"><label>审批备注</label><textarea id="notes" placeholder="例如：仅批准 tests/spike/overlay/** 内的窗口技术验证；不得扩展功能。" maxlength="400"></textarea><label>再次输入工单 ID 以确认</label><input id="confirm-id" spellcheck="false" autocomplete="off"><div class="buttons" style="margin-top:22px;justify-content:flex-end"><button class="button secondary" id="cancel">取消</button><button class="button primary" id="approve-final">确认批准并记录 Git</button></div></dialog>
<script src="/app.js" defer></script>
</body>
</html>
